services:
  postgres:
    image: postgres:16-alpine
    container_name: apiv1
    restart: unless-stopped
    environment:
      POSTGRES_DB: user-db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user-pass
    ports:
      - "5551:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hellocsharp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: